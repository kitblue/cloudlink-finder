services:
  cloudlink-finder:
    image: cloudlink-finder:__VERSION__
    container_name: cloudlink-finder
    restart: unless-stopped
    ports:
      - "${PORT:-8899}:80"
    volumes:
      - /var/apps/cloudlink-finder/shares/cloudlink-finder/data:/app/data
    environment:
      TZ: Asia/Shanghai
      PANSEARCH_DATA_DIR: /app/data
      PANSEARCH_CACHE_TTL: "300"
    logging:
      options:
        max-size: 10m
        max-file: "3"
