name: Build Offline FPK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpk/**'
      - 'docker/**'
      - 'scripts/**'
      - 'backend/**'
      - 'frontend/**'
      - 'nginx/**'
      - 'supervisor/**'
      - '.github/workflows/build-fpk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 预构建前端
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build
          test -f dist/index.html

      - name: 构建并导出 Docker 镜像
        run: |
          VERSION="$(awk -F '=' '/^[[:space:]]*version[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2}' fpk/manifest)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Dockerfile 使用根目录 dist/，将前端产物复制过去作为构建上下文
          mkdir -p dist
          cp -r frontend/dist/. dist/
          docker build -t "cloudlink-finder:${VERSION}" -f docker/Dockerfile .
          mkdir -p release
          docker save "cloudlink-finder:${VERSION}" | gzip > "release/cloudlink-finder-${VERSION}.tar.gz"
          ls -lh release/

      - name: 组装离线 FPK
        run: bash scripts/build-offline-fpk.sh

      - name: 上传 FPK 产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudlink-finder-offline-fpk
          path: release/*.fpk

      - name: 发布 Release（含离线 fpk）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.VERSION }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} 已存在，跳过创建"
          else
            gh release create "v${VERSION}" "release/cloudlink-finder-${VERSION}-offline.fpk" \
              --title "CloudLink Finder v${VERSION} (offline)" \
              --notes "离线安装包：Docker 镜像已内置，安装无需连接 Docker Hub。"
          fi

      - name: 在线计算 sha256 并更新 fnthird 源
        env:
          FNTHIRD_TOKEN: ${{ secrets.FNTHIRD_TOKEN }}
        run: |
          FPK=$(ls release/*.fpk | head -1)
          SHA=$(sha256sum "$FPK" | awk '{print $1}')
          SIZE=$(stat -c%s "$FPK")
          echo "fpk=${FPK}"
          echo "sha256=${SHA}"
          echo "size=${SIZE}"
          APP_VERSION="${{ env.VERSION }}" APP_SHA256="${SHA}" APP_SIZE="${SIZE}" python3 scripts/update_source_entry.py
